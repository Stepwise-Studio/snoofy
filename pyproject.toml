[project]
name = "snoofy"
version = "0.1.0"
description = "Computer use for Linux (GNOME): agents read and use apps in the background and arrange windows across monitors, over MCP."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []  # the system's PyGObject (python3-gi) and AT-SPI, nothing from PyPI

[project.urls]
Homepage = "https://github.com/Stepwise-Studio/snoofy"

[project.scripts]
snoofy = "snoofy_mcp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["snoofy.py", "snoofy_mcp.py", "snoofy-shell.js", "snoofy-shell.json", "LICENSE"]
